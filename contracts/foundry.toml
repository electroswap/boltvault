[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
# etn-sc is a go-ethereum fork; no PUSH0 assumptions.
evm_version = "paris"
remappings = ["forge-std/=lib/forge-std/src/"]

[rpc_endpoints]
electroneum = "https://rpc.ankr.com/electroneum"
electroneum_testnet = "https://rpc.ankr.com/electroneum_testnet"

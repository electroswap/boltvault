name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r --no-bail typecheck
      # Live RPC/tokenlist tests are skipped on CI (SKIP_LIVE=1) so the suite
      # doesn't depend on public RPC availability.
      - run: SKIP_LIVE=1 pnpm test:ci

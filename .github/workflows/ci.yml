# Actions are pinned to full commit SHAs, with the version in a comment
# (ES-BV-050). A tag is a mutable pointer: whoever can move `v4` runs code in a
# job that has this repository's credentials. Renovate's digest pinning keeps
# them current; the comment is what makes a bump reviewable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: typecheck · lint · no-any · depcruise · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-bail typecheck
      - run: pnpm lint
      - run: pnpm no-any
      - run: pnpm depcruise
      # Live RPC/tokenlist/GraphQL tests are skipped on CI (SKIP_LIVE=1) so the
      # suite never depends on public endpoint availability.
      - run: SKIP_LIVE=1 pnpm test:ci
      # Supply chain (§3.7): the SBOM ships as an artifact; the audit is reported on every run and reviewed
      # in the dependency dashboard (Renovate + OSV) — the remaining advisories sit in prebuilt vendor
      # bundles (Trezor Connect, Expo tooling) that pnpm overrides cannot reach. Critical findings block.
      - run: pnpm audit --audit-level=critical --prod || (pnpm audit --json > audit.json; exit 1)
      - run: pnpm audit --json > audit.json || true
      - run: pnpm sbom
      # Build integrity (§3.7, ATT-BV-008): nothing signed with the SDK's public
      # debug key may leave this repository. The verifier is a no-op when the
      # working tree holds no APK, and refuses outright when it holds one that
      # names CN=Android Debug.
      - name: no debug-signed APK in the tree
        run: |
          shopt -s nullglob globstar
          apks=(build/**/*.apk apps/mobile/android/app/build/outputs/**/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then echo "no APK to check"; else node tools/verify-apk-signer.mjs "${apks[@]}"; fi
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: sbom-and-audit
          path: |
            sbom.cdx.json
            audit.json

  extension:
    name: extension build · Playwright smoke
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Reproducible build (§3.7): build twice, the manifests must match; Firefox MV3 builds too.
      # `build:repro` is BOLTVAULT_HARNESS=0, so `.output/chrome-mv3` is the
      # artifact that ships — no screenshot harness in it, and the hash below is
      # over exactly those bytes.
      - run: pnpm build:repro
      - run: cp apps/extension/.output/chrome-mv3.manifest.json /tmp/first.json
      - run: pnpm build:repro
      - run: cmp /tmp/first.json apps/extension/.output/chrome-mv3.manifest.json
      # ...which leaves the visual-regression specs with no harness page to open.
      # So build it separately, into `.output/chrome-mv3-harness`: the release
      # artifact and its hash are untouched (WXT clears only the directory it
      # writes), and e2e/extension.ts points the screenshot specs at the sibling.
      # Both properties hold at once — nothing ships the harness, everything
      # still gets photographed.
      - run: pnpm build:harness
      - run: pnpm --filter @boltvault/extension exec playwright install --with-deps chromium
      # BOLTVAULT_RELEASE_BUILD=1 tells gate.spec.ts that `.output/chrome-mv3` is
      # meant to be a release: without it the size gate SKIPS itself on a build
      # that contains a harness, which on CI would hide the harness shipping
      # again behind a green run.
      - run: BOLTVAULT_RELEASE_BUILD=1 pnpm --filter @boltvault/extension e2e
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: extension-build-and-screenshots
          path: |
            apps/extension/.output/chrome-mv3
            apps/extension/.output/chrome-mv3.manifest.json
            apps/extension/.output/firefox-mv3.manifest.json
            apps/extension/screenshots
          if-no-files-found: ignore

  mobile:
    name: mobile bundle (Metro export)
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Proves the shared screens resolve and bundle under Metro; native builds
      # run on EAS from M9 onward.
      - run: pnpm --filter @boltvault/mobile bundle
      # App Links and Universal Links only verify against a real signing
      # fingerprint and a real Team ID. With the placeholders still in place the
      # association files verify for nobody, every `https://wallet.electroswap.io`
      # link falls back to the browser or a disambiguation dialog, and another
      # app that claims the same host is indistinguishable to the user. These
      # must not be able to reach a release branch.
      # Warns while the values are still outstanding, and fails outright on a
      # release ref, so they cannot ship unnoticed.
      - name: association files carry no placeholders
        run: |
          if grep -rn 'REPLACE' apps/mobile/well-known/ apps/mobile/app.json apps/mobile/eas.json; then
            if [ "${{ startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') }}" = "true" ]; then
              echo "::error::placeholder values above must be filled in before release"
              exit 1
            fi
            echo "::warning::placeholder values above must be filled in before release"
          fi
      # The iOS home-screen widget is a second Xcode target, generated at prebuild
      # by @bacons/apple-targets from apps/mobile/targets/widget. Nothing in the JS
      # toolchain compiles it, so its absence is invisible until someone installs a
      # build and finds no widget — while the app writes a snapshot (src/widget.ts)
      # into an App Group container that no extension is there to read.
      # Same idiom as the placeholders above: warn while it is outstanding, fail on
      # a release ref. Steps to close it: apps/mobile/native/README.md.
      - name: iOS widget target is registered
        env:
          RELEASE_REF: ${{ startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          node -e '
            const fs = require("node:fs")
            const app = require("./apps/mobile/app.json").expo
            const pkg = require("./apps/mobile/package.json")
            const deps = { ...pkg.dependencies, ...pkg.devDependencies }
            const plugins = (app.plugins ?? []).map((p) => (Array.isArray(p) ? p[0] : p))
            const gaps = []
            if (!deps["@bacons/apple-targets"]) gaps.push("@bacons/apple-targets is not a dependency of apps/mobile")
            if (!plugins.includes("@bacons/apple-targets")) gaps.push("@bacons/apple-targets is not in expo.plugins (apps/mobile/app.json)")
            if (!app.ios?.appleTeamId) gaps.push("expo.ios.appleTeamId is unset, so the widget extension has no team to sign against")
            if (!fs.readdirSync("apps/mobile/targets/widget").some((f) => f.endsWith(".swift"))) gaps.push("no .swift source in apps/mobile/targets/widget, and apple-targets compiles only that directory")
            if (gaps.length === 0) process.exit(0)
            const release = process.env.RELEASE_REF === "true"
            console.log(`::${release ? "error" : "warning"}::iOS widget target will not be built by expo prebuild: ${gaps.join("; ")} — see apps/mobile/native/README.md`)
            process.exit(release ? 1 : 0)
          '
